# MadGrow single-VPS reverse proxy.
# Serves the Next.js web app on / and the API on /api (same origin, so login
# cookies are first-party and no CORS is needed).
#
# Install:
#   sudo cp deploy/nginx-madgrow.conf /etc/nginx/sites-available/madgrow
#   sudo ln -s /etc/nginx/sites-available/madgrow /etc/nginx/sites-enabled/madgrow
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see DEPLOY.md) to add HTTPS automatically.

server {
    listen 80;
    listen [::]:80;

    # >>> replace with your real domain <<<
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 2m;

    # API: /api/stocks/... -> 127.0.0.1:4000/stocks/...
    # (the trailing slash on proxy_pass strips the /api prefix)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the Next.js web app.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
